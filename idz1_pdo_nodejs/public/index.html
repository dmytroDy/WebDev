<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lessons Schedule</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js" defer></script>
</head>
<body>
    <h3>Розклад по групам: </h3>
    <label>Оберіть групу: </label>
    <select id="group_sel">
    </select>
    <input id="group_btn" type="button" value="Пошук">

    <table id="table_group">
        <thead>
            <tr>
                <th>День тижня</th>
                <th>Кількість занять</th>
                <th>Аудиторія</th>
                <th>Дисципліна</th>
                <th>Викладач</th>
                <th>Тип</th>
            </tr>
        </thead>
        <tbody id="table_body_group">
        </tbody>
    </table>

    <!--  -->

    <h3>Розклад для викладачів: </h3>
    <label>Оберіть викладача: </label>
    <select id="teacher_sel">
    </select>
    <input id="teacher_btn" type="button" value="Пошук">

    <table id="table_teacher">
        <thead>
            <tr>
                <th>День тижня</th>
                <th>Кількість занять</th>
                <th>Аудиторія</th>
                <th>Дисципліна</th>
                <th>Викладач</th>
                <th>Тип</th>
            </tr>
        </thead>
        <tbody id="table_body_teacher">
        </tbody>
    </table>

    <!--  -->

    <h3>Розклад аудиторій: </h3>
    <label>Оберіть аудиторію: </label>
    <select id="auditorium_sel">
    </select>
    <input id="auditorium_btn" type="button" value="Пошук">

    <table id="table_auditorium">
        <thead>
            <tr>
                <th>День тижня</th>
                <th>Кількість занять</th>
                <th>Аудиторія</th>
                <th>Дисципліна</th>
                <th>Викладач</th>
                <th>Тип</th>
            </tr>
        </thead>
        <tbody id="table_body_auditorium">
        </tbody>
    </table>
    
</body>
</html>
